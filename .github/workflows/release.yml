name: Portable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build'
        required: true
        default: 'v0.1.8'
        type: string
      publish_existing:
        description: 'Verify and publish the draft after offline signed update files have been uploaded'
        required: false
        default: false
        type: boolean
      refresh_feed:
        description: 'Repair only the public update indexes after a feed publication failure (no asset changes)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.publish_existing && !inputs.refresh_feed }}
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            platform: windows/amd64
            runner: windows-2025
          - target: darwin-arm64
            platform: darwin/arm64
            runner: macos-15
          - target: darwin-amd64
            platform: darwin/amd64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      GOFLAGS: '-mod=readonly'
      TARGET: ${{ matrix.target }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check release version
        run: python packaging/package.py --check-version "$RELEASE_TAG"
      - name: Tests and static checks
        run: |
          go test ./... -count=1
          go vet ./...
          node resources/login-ui.test.cjs
          python -m unittest discover -s packaging -p 'test_*.py'
      - name: Build portable app without installers
        run: go run github.com/egoist/mygo/cmd/mygo build -platform "$BUILD_PLATFORM" -skip-installer -skip-dmg -skip-notarize
      - name: Verify Windows file properties
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $info = (Get-Item -LiteralPath 'build/windows-amd64/NGAReader.exe').VersionInfo
          $version = (Get-Content -Raw mygo.json | ConvertFrom-Json).version
          if ($info.FileVersion -ne $version -or $info.ProductName -ne 'NGA Reader 工作台' -or !$info.InternalName -or !$info.FileDescription) { throw 'Windows product metadata is incomplete' }
          $info | Select-Object FileVersion,ProductVersion,ProductName,InternalName,FileDescription
      - name: Verify Mac app signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict "build/$TARGET/NGAReader.app"
      - name: Verify executable license output
        run: |
          if [[ "$TARGET" == windows-* ]]; then
            executable="build/$TARGET/NGAReader.exe"
          else
            executable="build/$TARGET/NGAReader.app/Contents/MacOS/NGAReader"
          fi
          "$executable" --licenses > "$RUNNER_TEMP/nga-licenses.txt"
          python -c "import os,pathlib; text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'nga-licenses.txt').read_text(encoding='utf-8'); assert 'mygo' in text.lower() and 'Go standard library' in text"
      - name: Package and verify ZIP
        run: python packaging/package.py --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Stage or publish verified portable release
    needs: build
    if: ${{ !cancelled() && (inputs.publish_existing || inputs.refresh_feed || needs.build.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Publisher fixes use the workflow revision; app builds above remain
          # pinned to the immutable version tag. Version checks prevent mixing.
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test release publisher
        run: python -m unittest discover -s packaging -p 'test_*.py'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.publish_existing && !inputs.refresh_feed }}
        with:
          pattern: portable-*
          path: dist
          merge-multiple: true
      - name: Stage native ZIPs for offline signing
        if: ${{ !inputs.publish_existing && !inputs.refresh_feed }}
        run: python packaging/publish.py --stage-only
      - name: Download and verify signed draft before publication
        if: ${{ inputs.publish_existing && !inputs.refresh_feed }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          python packaging/publish.py
      - name: Repair signed public indexes without changing assets
        if: ${{ inputs.refresh_feed }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          python packaging/publish.py --feed-only
